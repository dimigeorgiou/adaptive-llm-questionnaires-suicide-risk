[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-questionnaires"
version = "1.0.0"
description = "Companion code for NICE TEAS Europe 2026: adaptive LLM questionnaires for suicide risk assessment"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Dimitrios Georgiou", email = "dgeorgiou@ionio.gr" },
  { name = "Akis Makrigiannis" },
  { name = "Vassilis C. Gerogiannis" },
  { name = "Andreas Kanavos", email = "akanavos@ionio.gr" },
]
keywords = [
  "large-language-models",
  "adaptive-questionnaires",
  "suicide-prevention",
  "clinical-nlp",
  "human-in-the-loop",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "tqdm>=4.60",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "PyYAML>=6.0",
  "requests>=2.28",
  "retry>=0.9.2",
  "google-api-python-client>=2.0",
  "google-auth>=2.0",
  "google-auth-httplib2>=0.1",
  "google-auth-oauthlib==0.4.1",
  "oauth2client>=4.1.3",
  "openai>=1.0",
  "tiktoken>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
semantic = ["sentence-transformers>=2.2"]
dropbox = ["dropbox>=11"]
legacy-db = ["dataset==1.1.2"]
gmail = ["beautifulsoup4>=4.9"]

[project.urls]
Homepage = "https://github.com/dimigeorgiou/adaptive-llm-questionnaires-suicide-risk"
OSF = "https://doi.org/10.17605/osf.io/vcjrm"
Repository = "https://github.com/dimigeorgiou/adaptive-llm-questionnaires-suicide-risk"

[project.scripts]
adaptive-questionnaires = "adaptive_questionnaires.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

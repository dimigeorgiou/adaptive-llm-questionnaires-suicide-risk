[admin]
full_name = Dimitrios Georgiou
email     = dgeorgiou@ionio.gr

[logger]
fn_path = ./logs/logs.log
name    = logger
level   = INFO
format  = %(asctime)s - %(levelname)s - %(message)s
asctime = %Y-%m-%d %H:%M:%S

[app]
official_name = Adaptive Personalized Questionnaires
name          = adaptive-llm-questionnaires-suicide-risk
dir_src       = ./src
dir_logs      = ./logs
dir_data      = ./data
dir_outputs   = ./outputs

[api_google]
token_saved_desination = local
token_file_path        = ./config/secrets/oauth_google.json
token_format           = json
# Least privilege: the pipeline only needs Google Sheets. Add scopes (space-separated)
# only if you use the optional Gmail/Docs/Drive helpers. After changing scopes, delete
# ./config/secrets/oauth_google_accessed.json and re-consent.
scopes                 = https://www.googleapis.com/auth/spreadsheets

[api_google_sheets]
service_name = sheets
version      = v4

[google_sheets]
reporter_id          = YOUR_GOOGLE_SHEETS_SPREADSHEET_ID_HERE
reporter_tab_input   = input
# The data row written for patient row i is derived from this range: "output" puts
# the header on row 1; "output!A2:AH" puts it on row 2 (the upstream deployment layout).
reporter_tab_output  = output
reporter_tab_prompts = prompts

[api_dropbox]
client_id     = YOUR_DROPBOX_CLIENT_ID_KEY_HERE
client_secret = YOUR_DROPBOX_CLIENT_SECRET_KEY_HERE
access_token  = YOUR_DROPBOX_ACCESS_TOKEN_KEY_HERE
refresh_token = YOUR_DROPBOX_REFRESH_TOKEN_KEY_HERE
auth_code     = YOUR_DROPBOX_AUTH_CODE_HERE

[dropbox]
google_oauth_accessed_dbx_path = /oauth_google_accessed.json

[api_openai]
token_key = YOUR_OPENAI_TOKEN_KEY_HERE

[openai]
model_name = gpt-4o-mini

[adaptive]
# legacy = original V1 algorithm (default). V2 is exposed through the separate
# v2_* operations and never changes the legacy Sheets layout.
mode                     = legacy
# true: refuse to update weights for a patient whose scores are blank, partial or out of
# range (reported, exit code 2). false: exact upstream arithmetic (unscored = 0).
legacy_strict_validation = true

[privacy]
# Never log clinical free text by default. Enable only for local debugging on an
# authorised machine.
log_clinical_text = false

[adaptive_v2]
# EXPERIMENTAL engineering defaults — NOT validated clinical parameters.
# See docs/ADAPTIVE_V2_DESIGN.md for every key.
candidates_per_slot        = 3
max_questions              = 20
min_questions              = 10
min_per_category           = 2
max_per_category           = 6
max_replacements_per_session = 10
replacement_margin         = 0.05
w_relevance                = 0.25
w_novelty                  = 0.20
w_coverage                 = 0.20
w_longitudinal             = 0.15
w_clinician_history        = 0.30
w_redundancy               = 0.40
near_duplicate_threshold   = 0.80
change_similarity_threshold = 0.60
redundancy_backend         = auto
history_sessions           = 3
ema_alpha                  = 0.5
prior_strength             = 2.0
new_question_prior         = 0.5
carryover_novelty          = 0.5
adaptive_length            = false
stop_min_utility           = 0.0
prompt_version             = v2-candidates-1
